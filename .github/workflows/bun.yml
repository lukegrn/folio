name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Bun in the runner environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Or specify a version like 1.3

      # Step 3: Install project dependencies (uses bun.lockb or bun.lock)
      - name: Install Dependencies
        run: bun i -D

      # Step 4: Execute the test runner
      - name: Run Tests
        run: |
          ls
          bun test
